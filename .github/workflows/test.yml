name: tests

on:
  push:
    branches: [main]
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ${{ matrix.platform }}
    env:
      # disable resyncing on uv run
      UV_NO_SYNC: "1"
      # test package pre-releases on cron-scheduled runs
      UV_PRERELEASE: ${{ github.event_name == 'schedule' && 'allow' || 'if-necessary-or-explicit' }}
    strategy:
      fail-fast: false
      matrix:
        # Python is swept fully (all 3 OS) only at the supported-version floor and
        # ceiling, since that's where a dependency-resolution or OS interaction is
        # most likely to first appear. The intermediate versions get a single-OS
        # sanity check instead of full cross-OS coverage -- an OS-specific bug that
        # only reproduces on 3.11 or 3.12 (and not 3.10 or 3.13) is possible but
        # unlikely enough not to justify the extra CI cost of testing for it.
        include:
          - platform: ubuntu-latest
            python-version: "3.10"
            resolution: lowest-direct
          - platform: macos-latest
            python-version: "3.10"
            resolution: lowest-direct
          - platform: windows-latest
            python-version: "3.10"
            resolution: lowest-direct
          - platform: ubuntu-latest
            python-version: "3.11"
            resolution: highest
          - platform: ubuntu-latest
            python-version: "3.12"
            resolution: highest
          - platform: ubuntu-latest
            python-version: "3.13"
            resolution: highest
          - platform: macos-latest
            python-version: "3.13"
            resolution: highest
          - platform: windows-latest
            python-version: "3.13"
            resolution: highest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --resolution ${{ matrix.resolution }}

      - name: Test with pytest
        run: |
          uv run pytest --color=yes --cov=funtracks --cov-report=xml --cov-report=term-missing tests

      - name: Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: funkelab/funtracks

  benchmark:
    # Linux only: macos-latest was too noisy to gate on even at 2x rounds (see git
    # history), and windows-latest -- while about as reliable as ubuntu-latest -- is a
    # flat ~1.5-3x slower across nearly every benchmark with no distinct regression
    # signal of its own, so it adds CI cost without adding anything ubuntu-latest
    # doesn't already catch.
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group testing

      # The baseline is measured here rather than restored from a cache, so that base
      # and head are timed on the same runner minutes apart. A cached baseline is
      # measured on a different machine at a different time (and potentially against
      # different dependencies), which made this gate fail on runner speed rather than
      # on code: the same commit compared against the same cached baseline came out at
      # +7% in one run and +131% in the next. These jobs take ~1 minute, so measuring
      # both sides every time is cheap.
      - name: Run baseline benchmark
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          # -o python_files: the base commit's pyproject.toml may predate the
          # bench_*.py collection config, so set it on the command line instead.
          uv run pytest tests/benchmarks/ -o "python_files=test_*.py bench_*.py" --benchmark-json baseline.json

      - name: Run benchmark on PR head
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          uv run pytest tests/benchmarks/ -o "python_files=test_*.py bench_*.py" --benchmark-json pr.json

      - name: Generate report
        id: report
        run: |
          uv run --with pandas --with tabulate python .github/workflows/benchmark_pr.py baseline.json pr.json report.md "Benchmark"
        continue-on-error: true

      - name: Comment on commit with report
        uses: peter-evans/commit-comment@v3
        if: github.event.pull_request.head.repo.fork == false
        with:
          body-path: report.md

      - name: Fail if regression detected
        if: steps.report.outcome == 'failure'
        run: exit 1
